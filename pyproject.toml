[tool.poetry]
name = "pttautosign"
version = "1.3.5"
description = "PTT Auto Sign - Automatically sign in to PTT BBS"
authors = ["CrazyCat <crazycat836@gmail.com>"]
readme = "README.md"
packages = [{include = "pttautosign", from = "src"}]
license = "Apache-2.0"
repository = "https://github.com/crazycat836/PTTAutoSign"
documentation = "https://github.com/crazycat836/PTTAutoSign/blob/main/README.md"
keywords = ["ptt", "bbs", "automation", "sign-in"]

[tool.poetry.dependencies]
python = "^3.11"
pyptt = ">=1.0.6,<3.0.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
# PyPtt (<=1.3.3) imports the deprecated `websockets.http` submodule, which
# was removed outright in websockets 17.0. Pin below that line until PyPtt
# itself drops the dependency; without this, `poetry update` silently
# resolves an incompatible websockets and breaks every PyPtt import.
websockets = "^16.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
pttautosign = "pttautosign.main:main"

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "pytest (>=9.0.3,<10.0)",
    "pytest-cov (>=5.0,<8.0)",
    "pytest-mock (>=3.12,<4.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
