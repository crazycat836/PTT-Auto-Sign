# Metadata lives in [project] (PEP 621), not [tool.poetry]. Poetry 2.x warns on
# every single command about the old keys, and that noise buries the messages
# worth reading -- `poetry check --lock` output, for one.
[project]
name = "pttautosign"
version = "1.4.0"
description = "PTT Auto Sign - Automatically sign in to PTT BBS"
authors = [{name = "CrazyCat", email = "crazycat836@gmail.com"}]
readme = "README.md"
license = "Apache-2.0"
keywords = ["ptt", "bbs", "automation", "sign-in"]
requires-python = ">=3.11,<4.0"
dependencies = [
    "pyptt>=2.3.7,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
]

[project.urls]
repository = "https://github.com/crazycat836/PTTAutoSign"
documentation = "https://github.com/crazycat836/PTTAutoSign/blob/main/README.md"

[project.scripts]
pttautosign = "pttautosign.main:main"

[tool.poetry]
packages = [{include = "pttautosign", from = "src"}]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "pytest (>=9.0.3,<10.0)",
    "pytest-cov (>=5.0,<8.0)",
    "pytest-mock (>=3.12,<4.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
