version: 2
updates:
  # ---------------------------------------------------------------- Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    target-branch: "main"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "python"
    groups:
      # 兩個分類，讓一週最多兩張 PR：執行期一張、開發工具一張。
      # 不再排除 major——每週跟上小版本，才不會等到 CVE 出現時被迫一次跳好幾個大版本。
      production:
        dependency-type: "production"
        patterns:
          - "*"
      development:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      # PyPtt (<=1.3.3) 還在 import websockets 17.0 已移除的 websockets.http。
      # pyproject 的 ^16.0 只擋得住 resolver，擋不住 Dependabot 主動放寬約束，
      # 所以這裡要再擋一次 major。PyPtt 拿掉這個相依後即可移除本條。
      - dependency-name: "websockets"
        update-types: ["version-update:semver-major"]

  # -------------------------------------------------------- GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"

  # ----------------------------------------------------------------- Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # 固定跑在 python:3.11-alpine；要換 Python 版本是人為決定，不交給機器。
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
