version: 2
updates:
  # ---------------------------------------------------------------- Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    target-branch: "main"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "python"
    groups:
      # 執行期與開發工具的小版本合成一張 PR。分成兩張時兩張都改 poetry.lock，
      # 先合併的那張會讓另一張衝突、要等 dependabot rebase 才合得進去。
      #
      # 大版本不放進來，各自開 PR：dependabot-auto-merge.yml 會把執行期套件的
      # 大版本留給人工審查，混在同一張 PR 裡會連小版本一起卡住。
      # 不排除 major——每週跟上，才不會等到 CVE 出現時被迫一次跳好幾個大版本。
      python:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # 資安修正（多半是 certifi 這類間接相依）不受上面的分類管，另外收成一張。
      # 大版本一樣不放進來，理由同上。
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # -------------------------------------------------------- GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"

  # ----------------------------------------------------------------- Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # 固定跑在 python:3.11-alpine；要換 Python 版本是人為決定，不交給機器。
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
