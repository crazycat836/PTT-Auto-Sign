name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # 只有一種情況要人看過：Python 執行期相依的大版本升級（例如 PyPtt 1→2），
      # 那會換掉實際跑在正式環境的東西。其餘都交給 CI 把關後自動合併——
      # 包含開發工具的大版本（pytest 8→9）與 GitHub Actions 的大版本
      # （actions/checkout v4→v5）。
      #
      # 注意 ecosystem 這個條件不能省：Actions 的相依也被歸類成
      # direct:production，只看 dependency-type 會把 checkout v4→v5 這種
      # CI 已經驗過的升級一起擋掉。
      - name: Decide whether this PR may auto-merge
        id: decide
        run: |
          if [ "$UPDATE_TYPE" != "version-update:semver-major" ]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
          elif [ "$ECOSYSTEM" = "pip" ] && [ "$DEP_TYPE" = "direct:production" ]; then
            echo "merge=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Python 執行期相依的大版本升級，保留給人工審查。"
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEP_TYPE: ${{ steps.metadata.outputs.dependency-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}

      # 這個 repo 沒有設必要狀態檢查，`gh pr merge --auto` 會在 CI 還沒回報前
      # 就直接合併。這裡改成盯住 CI 的 test check，過了才往下走。
      # 不能用 `gh pr checks --watch`：本工作流程自己也是這張 PR 上的一個 check，
      # 那樣會等到自己身上而卡死。
      - name: Wait for CI to pass
        if: steps.decide.outputs.merge == 'true'
        run: |
          for i in $(seq 1 60); do
            state=$(gh pr checks "$PR_URL" --json name,state \
              --jq '.[] | select(.name == "test") | .state' 2>/dev/null | head -1) || true
            case "$state" in
              SUCCESS)
                echo "CI 通過，繼續合併。"
                exit 0
                ;;
              FAILURE|CANCELLED|TIMED_OUT|ACTION_REQUIRED|STARTUP_FAILURE|STALE)
                echo "::error::CI 結果為 $state，不合併這張 PR。"
                exit 1
                ;;
              *)
                echo "等 CI（目前：${state:-尚未回報}）… ($i/60)"
                sleep 10
                ;;
            esac
          done
          echo "::error::等 CI 超過 10 分鐘仍未結束，不合併這張 PR。"
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge
        if: steps.decide.outputs.merge == 'true'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
